# Included inside the existing server block; preserve the existing root website.
include /etc/nginx/snippets/landscape-image-proxy.conf;
location = /landscape {
    return 301 /landscape/;
}
location /landscape/ {
    proxy_pass http://127.0.0.1:5051/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /landscape;
    client_max_body_size 21m;
    proxy_read_timeout 90s;
    proxy_connect_timeout 5s;
    # The application sets no-store for HTML/APIs and allows public image caching.
}
