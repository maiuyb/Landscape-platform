# Public uploads and thumbnail bytes only; never cache account or recipe APIs.
location ^~ /landscape/api/thumb/ {
    proxy_pass http://127.0.0.1:5051/api/thumb/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /landscape;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_cache landscape_images;
    proxy_cache_key "$scheme|$host|$request_uri";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 6s;
    proxy_cache_valid 200 1h;
    proxy_cache_revalidate on;
    proxy_read_timeout 15s;
    add_header X-Landscape-Image-Cache $upstream_cache_status;
}
location ^~ /landscape/uploads/ {
    proxy_pass http://127.0.0.1:5051/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /landscape;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_cache landscape_images;
    proxy_cache_key "$scheme|$host|$request_uri";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 6s;
    proxy_cache_valid 200 1h;
    proxy_cache_revalidate on;
    proxy_read_timeout 30s;
    add_header X-Landscape-Image-Cache $upstream_cache_status;
}
