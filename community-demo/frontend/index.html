<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风景调色 · 社区</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">风景调色<span>社区</span></div>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
    <input id="search" type="text" placeholder="搜索配方 / 标签 / 作者，回车确认">
  </div>
  <div id="authArea" class="auth-area"></div>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>发现好用的风景调色配方</h1>
    <p>浏览 · 收藏 · 一键套用社区里的作品</p>
  </div>
  <div class="hero-stats" id="heroStats"></div>
</section>

<main class="container">
  <section class="section">
    <div class="section-head">
      <h2>为你推荐</h2>
      <span class="muted">按收藏数排序</span>
    </div>
    <div id="recommend" class="recommend-row"></div>
  </section>

  <section class="section">
    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" data-view="community">全部作品</button>
        <button class="tab" data-view="mine">我的上传</button>
        <button class="tab" data-view="favorites">我的收藏</button>
        <button class="tab" data-view="records">上传记录</button>
      </div>
      <div class="tools">
        <select id="category" class="select"><option value="">全部分类</option></select>
        <select id="sort" class="select">
          <option value="favorites">按收藏数</option>
          <option value="latest">按最新</option>
        </select>
        <button id="publishBtn" class="btn primary">发布作品</button>
      </div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="records" class="records" style="display:none"></div>
    <div id="empty" class="empty" style="display:none">没有更多内容了</div>
    <div class="loadmore"><button id="loadMore" class="btn ghost" style="display:none">加载更多</button></div>
  </section>
</main>

<!-- 详情 -->
<div id="detailModal" class="modal">
  <div class="modal-card">
    <button class="close" data-close>&times;</button>
    <div id="detailBody"></div>
  </div>
</div>

<!-- 登录 -->
<div id="authModal" class="modal">
  <div class="modal-card small">
    <button class="close" data-close>&times;</button>
    <h3 id="authTitle">登录</h3>
    <label class="field-label">用户名</label>
    <input id="authUser" class="input" placeholder="用户名">
    <label class="field-label">密码</label>
    <input id="authPass" class="input" type="password" placeholder="密码">
    <div class="modal-actions">
      <button id="authSubmit" class="btn primary">登录</button>
      <button id="authToggle" class="btn ghost">没有账号？去注册</button>
    </div>
    <div class="hint">测试账号：<b>demo</b> / <b>demo1234</b></div>
    <div id="authError" class="error"></div>
  </div>
</div>

<!-- 发布 -->
<div id="publishModal" class="modal">
  <div class="modal-card">
    <button class="close" data-close>&times;</button>
    <h3>发布作品</h3>
    <div class="form">
      <label class="field-label">名称</label>
      <input id="pName" class="input" placeholder="例如：通透日落">
      <label class="field-label">描述</label>
      <input id="pDesc" class="input" placeholder="一句话说明效果">
      <div class="row">
        <div class="col">
          <label class="field-label">分类</label>
          <input id="pCategory" class="input" placeholder="例如：日落 / 雪景">
        </div>
        <div class="col">
          <label class="field-label">标签</label>
          <input id="pTags" class="input" placeholder="逗号分隔，例如：日落,通透">
        </div>
      </div>
      <label class="field-label">作品图（作为封面）</label>
      <input id="pCover" type="file" accept="image/*" class="file-input">
      <div class="steps">
        <div class="steps-title">配方参数（简单版）</div>
        <label>风格预设
          <select id="pPreset" class="select">
            <option value="">无</option>
            <option value="clarity">通透</option>
            <option value="warm-autumn">暖秋</option>
            <option value="film">胶片</option>
            <option value="cool-tone">冷调</option>
            <option value="bw">黑白</option>
            <option value="vivid">鲜艳</option>
          </select>
        </label>
        <label>亮度 <input id="pBrightness" type="range" min="-100" max="100" value="0"><span class="val" data-for="pBrightness">0</span></label>
        <label>对比度 <input id="pContrast" type="range" min="-100" max="100" value="0"><span class="val" data-for="pContrast">0</span></label>
        <label>饱和度 <input id="pSaturation" type="range" min="-100" max="100" value="0"><span class="val" data-for="pSaturation">0</span></label>
        <label>色温 <input id="pTemperature" type="range" min="-100" max="100" value="0"><span class="val" data-for="pTemperature">0</span></label>
      </div>
      <div class="modal-actions"><button id="publishSubmit" class="btn primary">发布</button></div>
      <div id="publishError" class="error"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
