<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Warm Gallery Paper Outer Ring -->
    <linearGradient id="ringBgA1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFBF8"/>
      <stop offset="100%" stop-color="#EAE3D5"/>
    </linearGradient>
    <!-- Misty Celadon Sky (accent-soft inspired) -->
    <linearGradient id="skyA1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F6F4"/>
      <stop offset="100%" stop-color="#DCE8E2"/>
    </linearGradient>
    <!-- Gallery Bronze Rim (bronze #8C653E) -->
    <linearGradient id="bronzeA1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C49A6C"/>
      <stop offset="50%" stop-color="#9A7046"/>
      <stop offset="100%" stop-color="#75512D"/>
    </linearGradient>
    <!-- Warm Golden Sun -->
    <linearGradient id="sunA1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="100%" stop-color="#C48B48"/>
    </linearGradient>
    <!-- Gallery Pine Green (green #1D4D3C) -->
    <linearGradient id="pineDarkA1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27604C"/>
      <stop offset="100%" stop-color="#193F31"/>
    </linearGradient>
    <clipPath id="lensClipA1">
      <circle cx="32" cy="32" r="23.5"/>
    </clipPath>
  </defs>

  <!-- Outer Lens Barrel (Light Ivory Paper + Gallery Bronze Bevel) -->
  <circle cx="32" cy="32" r="30" fill="url(#ringBgA1)" stroke="url(#bronzeA1)" stroke-width="2.2"/>
  <circle cx="32" cy="32" r="26.3" fill="none" stroke="#9A7046" stroke-width="0.95" stroke-opacity="0.5" stroke-dasharray="2.5 2.5"/>

  <!-- Astrolabe Cardinal Calibration Ticks -->
  <g stroke="url(#bronzeA1)" stroke-width="1.8" stroke-linecap="round">
    <line x1="32" y1="2.2" x2="32" y2="6.5"/>
    <line x1="32" y1="57.5" x2="32" y2="61.8"/>
    <line x1="2.2" y1="32" x2="6.5" y2="32"/>
    <line x1="57.5" y1="32" x2="61.8" y2="32"/>
  </g>

  <!-- Inner Mountain & Sun Scene -->
  <g clip-path="url(#lensClipA1)">
    <circle cx="32" cy="32" r="23.5" fill="url(#skyA1)"/>
    <!-- Subtle Astrolabe Crosshair -->
    <line x1="8" y1="32" x2="56" y2="32" stroke="#8C653E" stroke-width="0.6" stroke-opacity="0.22"/>
    <line x1="32" y1="8" x2="32" y2="56" stroke="#8C653E" stroke-width="0.6" stroke-opacity="0.22"/>

    <!-- Warm Amber Sun Disc -->
    <circle cx="42" cy="21" r="4.8" fill="url(#sunA1)"/>

    <!-- Back Right Peak (Soft Sage & Pine) -->
    <polygon points="30,43 43,25.5 55,43" fill="#467A67"/>
    <polygon points="43,25.5 39.5,43 30,43" fill="#82AC9B"/>

    <!-- Main Left Alpine Peak (Sunlit Warm Ivory + Gallery Forest Green) -->
    <polygon points="10,43 26,17.5 41.5,43" fill="url(#pineDarkA1)"/>
    <polygon points="10,43 26,17.5 28.2,43" fill="#FFFDF9"/>
    <polyline points="26,17.5 28.2,43" fill="none" stroke="#C49A6C" stroke-width="0.8" stroke-opacity="0.6"/>

    <!-- Calm Water Reflection Base -->
    <rect x="7" y="43" width="50" height="14" fill="#234E3E"/>
    <line x1="10" y1="43" x2="54" y2="43" stroke="url(#bronzeA1)" stroke-width="1.6"/>
    <line x1="17" y1="47.5" x2="47" y2="47.5" stroke="#FAF8F2" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="23" y1="51.5" x2="41" y2="51.5" stroke="#E8C594" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
  </g>

  <!-- Inner Optical Rim -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="url(#bronzeA1)" stroke-width="1.5"/>
</svg>
